<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VocalStripper</title>
  <style>
    :root { color-scheme: dark; --bg: #080b10; --panel: #10161f; --line: #273342; --ink: #f3f7fc; --muted: #91a0b2; --cyan: #5de8ff; --violet: #9f7cff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; color: var(--ink); background: radial-gradient(circle at 82% 0%, #1c1940 0, transparent 34%), radial-gradient(circle at 0% 100%, #06333c 0, transparent 32%), var(--bg); font: 15px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; opacity: .22; pointer-events: none; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(to bottom, #000, transparent); }
    main { position: relative; width: min(100%, 620px); margin: auto; padding: 30px 34px; }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 700; }
    .bot { display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid #5de8ff80; border-radius: 7px 7px 2px 2px; color: var(--cyan); box-shadow: 0 0 22px #5de8ff3b; }
    .bot::before { content: "◉"; font-size: 12px; }
    .ready { display: flex; align-items: center; gap: 7px; }
    .ready::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #73ffbe; box-shadow: 0 0 10px #73ffbe; }
    h1 { max-width: 500px; margin: 0; font: 500 clamp(35px, 7vw, 54px)/.96 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.075em; }
    h1 span { color: var(--cyan); }
    .intro { max-width: 470px; margin: 16px 0 28px; color: var(--muted); line-height: 1.55; }
    .console { border: 1px solid var(--line); background: linear-gradient(135deg, #151c27e8, #0b1018e8); box-shadow: 0 18px 60px #0008, inset 0 1px #ffffff0d; }
    .console-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); color: #728196; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .lights { display: flex; gap: 5px; }
    .lights i { width: 7px; height: 7px; border-radius: 50%; background: #48566a; }
    .lights i:first-child { background: var(--cyan); box-shadow: 0 0 9px var(--cyan); }
    .content { padding: 18px; }
    #file { min-height: 58px; display: flex; align-items: center; padding: 12px 14px; border: 1px dashed #496176; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    #file.has-file { border-style: solid; border-color: #5de8ff90; color: var(--ink); background: #5de8ff0a; }
    .pick { width: 100%; margin-top: 10px; border: 1px solid #3e5268; background: #192432; color: var(--ink); }
    button { min-height: 46px; border: 0; cursor: pointer; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .09em; text-transform: uppercase; transition: .18s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.12); }
    button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .48; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 10px; }
    .mode { padding: 13px 10px; border: 1px solid var(--line); background: #0b1119; color: var(--muted); text-align: left; }
    .mode b, .mode small { display: block; }
    .mode b { margin-bottom: 4px; color: inherit; font-size: 12px; }
    .mode small { font: 11px/1.35 Inter, ui-sans-serif, sans-serif; letter-spacing: 0; text-transform: none; }
    .mode.active { border-color: var(--cyan); background: linear-gradient(120deg, #5de8ff1b, #9f7cff12); color: var(--ink); box-shadow: inset 3px 0 var(--cyan); }
    #extract { width: 100%; margin-top: 8px; background: linear-gradient(100deg, var(--cyan), #8a9fff); color: #061018; box-shadow: 0 8px 28px #5de8ff33; }
    #status { min-height: 22px; margin-top: 14px; color: var(--muted); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #status::before { content: ">_ "; color: var(--cyan); }
    @media (max-width: 520px) { main { padding: 24px; } h1 { font-size: 38px; } }
  </style>
</head>
<body>
  <main>
    <header class="topline"><div class="brand"><i class="bot"></i> VocalStripper</div><div class="ready">Local AI ready</div></header>
    <h1>Extract the<br><span>right stem.</span></h1>
    <p class="intro">Drop in an MP3 or video, choose the layer you need, and Demucs separates it on your Mac.</p>
    <section class="console">
      <div class="console-head"><span>separation console</span><span class="lights"><i></i><i></i><i></i></span></div>
      <div class="content">
        <div id="file">Awaiting source file…</div>
        <button class="pick" id="choose">Choose audio or video</button>
        <div class="modes" role="group" aria-label="Output mode">
          <button class="mode active" data-mode="instrumental" aria-pressed="true"><b>Instrumental</b><small>Remove vocals. Keep the music.</small></button>
          <button class="mode" data-mode="vocals" aria-pressed="false"><b>Vocals</b><small>Remove the instrumental.</small></button>
        </div>
        <button id="extract" disabled>Generate instrumental</button>
        <div id="status">Select a source file to begin.</div>
      </div>
    </section>
  </main>
  <script>
    const choose = document.querySelector('#choose');
    const extract = document.querySelector('#extract');
    const file = document.querySelector('#file');
    const status = document.querySelector('#status');
    const modes = [...document.querySelectorAll('.mode')];
    let mode = 'instrumental';

    function updateMode(next) {
      mode = next;
      modes.forEach(button => {
        const selected = button.dataset.mode === mode;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', selected);
      });
      extract.textContent = `Generate ${mode}`;
    }

    modes.forEach(button => button.addEventListener('click', () => updateMode(button.dataset.mode)));

    choose.addEventListener('click', async () => {
      const selected = await window.pywebview.api.choose_file();
      if (!selected) return;
      file.textContent = selected.name;
      file.classList.add('has-file');
      extract.disabled = false;
      status.textContent = `${mode} mode armed.`;
    });

    extract.addEventListener('click', async () => {
      extract.disabled = true;
      choose.disabled = true;
      modes.forEach(button => button.disabled = true);
      status.textContent = `Separating ${mode}…`;
      await new Promise(requestAnimationFrame);
      try {
        const result = await window.pywebview.api.extract(mode);
        status.textContent = `Saved ${result.name} beside the source file.`;
      } catch (error) {
        status.textContent = error.message || `Could not generate ${mode}.`;
      } finally {
        extract.disabled = false;
        choose.disabled = false;
        modes.forEach(button => button.disabled = false);
      }
    });
  </script>
</body>
</html>
